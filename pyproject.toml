[project]
name = "aurora-earth-system-pipeline"
version = "0.1.0"
description = "DIMER pipeline for Aurora 0.25° small pretrained (microsoft/aurora): 6-hourly global weather forecasting from gridded analyses, lead-time evaluation against persistence, and bounded LoRA fine-tuning of the foundation model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  # Both upstream assets are pickles; this package converts them once into safetensors (docs/WEIGHTS.md) and
  # builds the architecture from the microsoft-aurora package on PyPI. numcodecs decodes the pinned
  # WeatherBench 2 Zarr chunks of the tutorial dataset; xarray/netCDF4 (aurora dependencies) serve BYOD NetCDF.
  "torch==2.14.0",
  "microsoft-aurora==2.0.1",
  "timm==1.0.29",
  "einops==0.8.2",
  "xarray==2026.7.0",
  "netCDF4==1.7.4",
  "numcodecs==0.17.0",
  "numpy==2.5.3",
  "safetensors==0.8.0",
  "huggingface-hub==1.32.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/aurora_earth_system_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tutorials"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
